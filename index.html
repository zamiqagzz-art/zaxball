<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zaxball Real Stadium Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: -apple-system, sans-serif; color: #fff; touch-action: none; }
        
        #canvas-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 35px rgba(0,0,0,0.9); display: none; background: #226633;
        }
        canvas { display: block; background: #226633; }

        .scoreboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            display: flex; align-items: center; background: rgba(0, 0, 0, 0.9); 
            padding: 5px 20px; border-radius: 30px; border: 2px solid #444; 
            font-weight: 900; font-size: 1.4rem; gap: 15px; pointer-events: none; z-index: 10; display: none;
        }
        .score.red { color: #ff3366; }
        .score.blue { color: #3399ff; }

        #mobile-kick-btn {
            display: none; position: fixed; bottom: 5%; right: 5%;
            width: 85px; height: 85px; background: #00ff66; border: 5px solid rgba(255,255,255,0.6);
            border-radius: 50%; color: #000; font-weight: 900; font-size: 1.2rem;
            align-items: center; justify-content: center; z-index: 50;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8); touch-action: none;
        }

        #settings-gear-btn {
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; cursor: pointer; z-index: 110; transition: all 0.2s;
        }

        #settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 120; align-items: center; justify-content: center;
        }
        .settings-box {
            width: 90%; max-width: 380px; background: #222; border: 2px solid #444;
            border-radius: 20px; padding: 25px; display: flex; flex-direction: column; gap: 20px;
        }
        .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .settings-row label { font-size: 0.95rem; font-weight: bold; color: #ccc; }
        .settings-box select, .settings-box input[type="range"] {
            background: #333; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 8px; outline: none;
        }

        .screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%); z-index: 100; gap: 20px;
        }
        h1 { font-size: 3.5rem; color: #00ff66; font-weight: 900; letter-spacing: 3px; }
        
        .lobby-box {
            width: 90%; max-width: 450px; background: rgba(255,255,255,0.03); 
            border: 2px solid #333; border-radius: 20px; padding: 25px;
            display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.8rem; color: #888; font-weight: bold; }

        input[type="text"] {
            background: #222; border: 2px solid #444; padding: 12px;
            border-radius: 10px; color: #fff; font-size: 1rem; outline: none; user-select: text; -webkit-user-select: text;
        }
        input[type="text"]:focus { border-color: #00ff66; }

        .btn {
            background: #00ff66; color: #000; border: none; padding: 14px;
            font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer;
            text-align: center; width: 100%;
        }
        .btn.sec { background: #3399ff; color: #fff; }
        .or-divider { text-align: center; color: #555; font-weight: bold; font-size: 0.9rem; }
        #room-status { font-size: 0.95rem; color: #00ff66; text-align: center; font-weight: bold; }
        .code-display { background: #111; border: 1px dashed #00ff66; padding: 10px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 1.2rem; color: #00ff66; }

        #leave-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(255, 51, 102, 0.2);
            color: #ff3366; border: 2px solid #ff3366; padding: 6px 15px; border-radius: 20px;
            font-weight: bold; cursor: pointer; display: none; z-index: 15;
        }

        .goal-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 5rem; font-weight: 900; color: #fff; z-index: 90; opacity: 0;
            pointer-events: none; transition: opacity 0.15s ease;
        }
        .goal-flash.active { opacity: 1; }
        .hidden { display: none !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="settings-gear-btn">⚙️</div>

    <div id="settings-modal">
        <div class="settings-box">
            <h3 style="text-align: center; color: #00ff66;">Oyun Ayarları</h3>
            <hr style="border: 0; border-top: 1px solid #444;">
            
            <div class="settings-row">
                <label>Görünüm:</label>
                <button class="btn" style="padding: 8px; font-size: 0.9rem; width: auto;" id="fullscreen-toggle-btn">Tam Ekran Yap</button>
            </div>

            <div class="settings-row">
                <label>Şut Buton Boyutu:</label>
                <input type="range" id="btn-size-slider" min="60" max="130" value="85">
            </div>

            <div class="settings-row">
                <label>Buton Konumu:</label>
                <select id="btn-side-select">
                    <option value="right">Sağ Taraf</option>
                    <option value="left">Sol Taraf</option>
                </select>
            </div>

            <button class="btn sec" style="margin-top: 10px; padding: 10px;" id="settings-close-btn">Ayarları Kapat</button>
        </div>
    </div>

    <div class="scoreboard" id="game-scoreboard">
        <span class="score red" id="red-score">0</span>
        <span style="color: #666;">-</span>
        <span class="score blue" id="blue-score">0</span>
    </div>

    <button id="leave-btn">ODADAN ÇIK</button>

    <div id="lobby-screen" class="screen">
        <h1>ZAXBALL P2P</h1>
        
        <div class="lobby-box">
            <div class="input-group">
                <label>OYUNCU ADI</label>
                <input type="text" id="name-input" placeholder="Adını yaz..." maxlength="12" value="OYUNCU">
            </div>

            <div id="initial-actions">
                <button class="btn" id="host-btn">SERVER / ODA KUR</button>
                <div class="or-divider">VEYA</div>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>ARKADAŞININ ODA KODU</label>
                    <input type="text" id="join-code-input" placeholder="Kodu buraya yapıştır...">
                </div>
                <button class="btn sec" id="join-btn">ODAYA KATIL</button>
            </div>

            <div id="status-area" class="hidden">
                <div id="room-status">Oda hazırlanıyor...</div>
                <div id="code-box" class="hidden">
                    <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px; text-align: center;">BU KODU ARKADAŞINA AT:</div>
                    <div class="code-display" id="generated-code">---</div>
                </div>
            </div>
        </div>
    </div>

    <div id="goal-screen" class="goal-flash">GOL!</div>
    <div id="mobile-kick-btn">ŞUT</div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Sabit Sanal Çözünürlük Dünyası
        const V_WIDTH = 1200;
        const V_HEIGHT = 700;
        canvas.width = V_WIDTH;
        canvas.height = V_HEIGHT;

        const gearBtn = document.getElementById('settings-gear-btn');
        const modal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('settings-close-btn');
        const sizeSlider = document.getElementById('btn-size-slider');
        const sideSelect = document.getElementById('btn-side-select');
        const fsBtn = document.getElementById('fullscreen-toggle-btn');
        const mobileKickBtn = document.getElementById('mobile-kick-btn');

        gearBtn.addEventListener('click', () => { modal.style.display = 'flex'; });
        closeSettings.addEventListener('click', () => { modal.style.display = 'none'; });
        
        sizeSlider.addEventListener('input', (e) => {
            let val = e.target.value;
            mobileKickBtn.style.width = val + 'px';
            mobileKickBtn.style.height = val + 'px';
            mobileKickBtn.style.fontSize = (val / 70) + 'rem';
        });

        sideSelect.addEventListener('change', (e) => {
            if(e.target.value === 'left') { mobileKickBtn.style.right = 'auto'; mobileKickBtn.style.left = '5%'; } 
            else { mobileKickBtn.style.left = 'auto'; mobileKickBtn.style.right = '5%'; }
        });

        fsBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            modal.style.display = 'none';
        });

        function resizeGame() {
            let windowWidth = window.innerWidth; let windowHeight = window.innerHeight;
            let windowRatio = windowWidth / windowHeight; let targetRatio = V_WIDTH / V_HEIGHT;
            if (windowRatio > targetRatio) {
                container.style.width = (windowHeight * targetRatio) + 'px'; container.style.height = windowHeight + 'px';
            } else {
                container.style.width = windowWidth + 'px'; container.style.height = (windowWidth / targetRatio) + 'px';
            }
        }
        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', () => { setTimeout(resizeGame, 200); });

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'kick') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(95, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'post') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'goal') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        let peer = null; let conn = null; let isHost = false;
        let redScore = 0; let blueScore = 0; let isGameActive = false;

        let ball = { x: 600, y: 350, vx: 0, vy: 0, radius: 11, friction: 0.98 };
        let pRed = { x: 300, y: 350, vx: 0, vy: 0, radius: 22, speed: 4.5, friction: 0.88, color: '#ff3366', name: 'EV SAHİBİ', number: '7', isKicking: false };
        let pBlue = { x: 900, y: 350, vx: 0, vy: 0, radius: 22, speed: 4.5, friction: 0.88, color: '#3399ff', name: 'MİSAFİR', number: '1', isKicking: false };
        let me = null;

        let keys = {};
        window.addEventListener('keydown', e => {
            if (e.key === ' ' || e.code === 'Space') { if (isGameActive) { e.preventDefault(); me.isKicking = true; } return; }
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => { if (e.key === ' ' || e.code === 'Space') { me.isKicking = false; } keys[e.key.toLowerCase()] = false; });

        function checkAndExecuteKick(p) {
            let dx = ball.x - p.x; let dy = ball.y - p.y; let dist = Math.hypot(dx, dy);
            if (dist < p.radius + ball.radius + 12) {
                let nx = dx / dist; let ny = dy / dist;
                ball.vx = nx * 13.0; ball.vy = ny * 13.0; // ŞUT GÜCÜ 13.0 Olarak Sabitlendi kanka!
                playSound('kick');
            }
        }

        let joystick = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0, touchId: null };

        document.getElementById('host-btn').addEventListener('click', () => {
            initAudio();
            let pName = document.getElementById('name-input').value.trim() || "EV SAHİBİ";
            pRed.name = pName.toUpperCase(); isHost = true; me = pRed;
            document.getElementById('initial-actions').classList.add('hidden');
            document.getElementById('status-area').classList.remove('hidden');
            let randomId = "ZAX-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomId);
            peer.on('open', (id) => {
                document.getElementById('room-status').innerText = "ODA AÇILDI. ARKADAŞINI BEKLE...";
                document.getElementById('code-box').classList.remove('hidden');
                document.getElementById('generated-code').innerText = id;
            });
            peer.on('connection', (connection) => { conn = connection; setupNetworkEvents(); });
        });

        document.getElementById('join-btn').addEventListener('click', () => {
            initAudio();
            let code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if(!code) { alert("Oda kodu eksik!"); return; }
            let pName = document.getElementById('name-input').value.trim() || "MİSAFİR";
            pBlue.name = pName.toUpperCase(); isHost = false; me = pBlue;
            document.getElementById('room-status').innerText = "Odaya uçuluyor...";
            document.getElementById('initial-actions').classList.add('hidden');
            document.getElementById('status-area').classList.remove('hidden');
            peer = new Peer();
            peer.on('open', () => { conn = peer.connect(code); setupNetworkEvents(); });
        });

        function setupNetworkEvents() {
            conn.on('open', () => { conn.send({ type: 'init', name: me.name }); });
            conn.on('data', (data) => {
                if (data.type === 'init') {
                    if(isHost) { pBlue.name = data.name; conn.send({ type: 'init_reply', name: pRed.name }); startTheMatch(); }
                }
                if (data.type === 'init_reply') { pRed.name = data.name; startTheMatch(); }
                if (isHost) {
                    if (data.type === 'client_input') { pBlue.vx = data.vx; pBlue.vy = data.vy; pBlue.isKicking = data.isKicking; }
                } else {
                    if (data.type === 'sync') {
                        ball.x = data.ball.x; ball.y = data.ball.y;
                        pRed.x = data.pRed.x; pRed.y = data.pRed.y; pRed.isKicking = data.pRed.isKicking;
                        pBlue.x = data.pBlue.x; pBlue.y = data.pBlue.y; pBlue.isKicking = data.pBlue.isKicking;
                        redScore = data.scores.red; blueScore = data.scores.blue;
                        document.getElementById('red-score').innerText = redScore; document.getElementById('blue-score').innerText = blueScore;
                    }
                    if (data.type === 'goal_event') triggerGoalVisual(data.winner);
                }
            });
            conn.on('close', () => { alert("Bağlantı kesildi!"); location.reload(); });
        }

        function startTheMatch() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-scoreboard').style.display = 'flex';
            document.getElementById('leave-btn').style.display = 'block';
            gearBtn.style.display = 'none'; 
            container.style.display = 'block';
            if ('ontouchstart' in window) mobileKickBtn.style.display = 'flex';
            resizeGame();
            isGameActive = true; resetPositions(); update();
        }

        document.getElementById('leave-btn').addEventListener('click', () => { location.reload(); });

        // JOYSTICK
        window.addEventListener('touchstart', e => {
            if (!isGameActive) return;
            for (let touch of e.changedTouches) {
                let isLeftOnScreen = touch.clientX < window.innerWidth / 2;
                let joystickSideCondition = (sideSelect.value === 'right') ? isLeftOnScreen : !isLeftOnScreen;
                if (joystickSideCondition && !joystick.active && e.target.id !== 'leave-btn') {
                    joystick.active = true; joystick.touchId = touch.identifier;
                    joystick.startX = touch.clientX; joystick.startY = touch.clientY;
                    joystick.moveX = touch.clientX; joystick.moveY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', e => {
            if (!isGameActive) return;
            for (let touch of e.changedTouches) {
                if (joystick.active && touch.identifier === joystick.touchId) {
                    joystick.moveX = touch.clientX; joystick.moveY = touch.clientY;
                    let dx = joystick.moveX - joystick.startX; let dy = joystick.moveY - joystick.startY;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 10) {
                        let angle = Math.atan2(dy, dx);
                        me.vx = Math.cos(angle) * me.speed; me.vy = Math.sin(angle) * me.speed;
                    }
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            for (let touch of e.changedTouches) {
                if (joystick.active && touch.identifier === joystick.touchId) {
                    joystick.active = false; joystick.touchId = null; me.vx = 0; me.vy = 0;
                }
            }
        });

        mobileKickBtn.addEventListener('touchstart', e => { e.preventDefault(); if (isGameActive) me.isKicking = true; });
        mobileKickBtn.addEventListener('touchend', e => { e.preventDefault(); me.isKicking = false; });

        function handleLocalInput() {
            if (joystick.active) return;
            let targetVx = 0; let targetVy = 0; let moving = false;
            if (keys['w'] || keys['arrowup']) { targetVy = -me.speed; moving = true; }
            if (keys['s'] || keys['arrowdown']) { targetVy = me.speed; moving = true; }
            if (keys['a'] || keys['arrowleft']) { targetVx = -me.speed; moving = true; }
            if (keys['d'] || keys['arrowright']) { targetVx = me.speed; moving = true; }
            if (moving) {
                if (targetVx !== 0 && targetVy !== 0) { targetVx *= 0.7071; targetVy *= 0.7071; }
                me.vx = targetVx; me.vy = targetVy;
            } else { me.vx *= me.friction; me.vy *= me.friction; if(Math.abs(me.vx)<0.1) me.vx=0; if(Math.abs(me.vy)<0.1) me.vy=0; }
        }

        function resetPositions() {
            ball.x = 600; ball.y = 350; ball.vx = 0; ball.vy = 0;
            pRed.x = 250; pRed.y = 350; pRed.vx = 0; pRed.vy = 0; pRed.isKicking = false;
            pBlue.x = 950; pBlue.y = 350; pBlue.vx = 0; pBlue.vy = 0; pBlue.isKicking = false;
        }

        function resolveCollision(obj1, obj2, isBall = false) {
            let dx = obj2.x - obj1.x; let dy = obj2.y - obj1.y; let distance = Math.hypot(dx, dy); let minDist = obj1.radius + obj2.radius;
            if (distance < minDist) {
                let overlap = minDist - distance; let nx = dx / distance; let ny = dy / distance;
                if (!isBall) { obj1.x -= nx * overlap * 0.5; obj1.y -= ny * overlap * 0.5; obj2.x += nx * overlap * 0.5; obj2.y += ny * overlap * 0.5; } 
                else { obj2.x += nx * overlap; obj2.y += ny * overlap; }
                let kx = obj1.vx - obj2.vx; let ky = obj1.vy - obj2.vy; let p = 2 * (nx * kx + ny * ky) / 2;
                obj1.vx -= nx * p; obj1.vy -= ny * p;
                obj2.vx += nx * p * (isBall ? 0.75 : 1); obj2.vy += ny * p * (isBall ? 0.75 : 1);
            }
        }

        function update() {
            if (!isGameActive) return;
            handleLocalInput();

            if (conn && conn.open && !isHost) {
                conn.send({ type: 'client_input', vx: me.vx, vy: me.vy, isKicking: me.isKicking });
            }

            let margin = 60; let goalHeight = 220; let goalTop = (V_HEIGHT - goalHeight) / 2;
            let goalBottom = goalTop + goalHeight; let goalDepth = 45;

            if (isHost) {
                pRed.x += pRed.vx; pRed.y += pRed.vy;
                pBlue.x += pBlue.vx; pBlue.y += pBlue.vy;

                if (pRed.isKicking) checkAndExecuteKick(pRed);
                if (pBlue.isKicking) checkAndExecuteKick(pBlue);

                let oldBallX = ball.x;
                ball.vx *= ball.friction; ball.vy *= ball.friction;
                ball.x += ball.vx; ball.y += ball.vy;

                if (ball.y < margin + ball.radius) { ball.y = margin + ball.radius; ball.vy *= -0.8; }
                if (ball.y > V_HEIGHT - margin - ball.radius) { ball.y = V_HEIGHT - margin - ball.radius; ball.vy *= -0.8; }

                if (ball.y >= goalTop && ball.y <= goalBottom) {
                    if (oldBallX >= margin && ball.x < margin) { triggerGoal('blue'); }
                    else if (oldBallX <= V_WIDTH - margin && ball.x > V_WIDTH - margin) { triggerGoal('red'); }
                }

                if (ball.x < margin + ball.radius && !(ball.y >= goalTop && ball.y <= goalBottom)) { ball.x = margin + ball.radius; ball.vx *= -0.8; }
                if (ball.x > V_WIDTH - margin - ball.radius && !(ball.y >= goalTop && ball.y <= goalBottom)) { ball.x = V_WIDTH - margin - ball.radius; ball.vx *= -0.8; }

                if (Math.abs(ball.x - margin) < ball.radius && (Math.abs(ball.y - goalTop) < ball.radius || Math.abs(ball.y - goalBottom) < ball.radius)) { ball.vx *= -0.9; ball.vy *= -0.9; playSound('post'); }
                if (Math.abs(ball.x - (V_WIDTH - margin)) < ball.radius && (Math.abs(ball.y - goalTop) < ball.radius || Math.abs(ball.y - goalBottom) < ball.radius)) { ball.vx *= -0.9; ball.vy *= -0.9; playSound('post'); }

                resolveCollision(pRed, pBlue); resolveCollision(pRed, ball, true); resolveCollision(pBlue, ball, true);

                [pRed, pBlue].forEach(p => {
                    if (p.x < margin + p.radius) { p.x = margin + p.radius; } if (p.x > V_WIDTH - margin - p.radius) { p.x = V_WIDTH - margin - p.radius; }
                    if (p.y < margin + p.radius) { p.y = margin + p.radius; } if (p.y > V_HEIGHT - margin - p.radius) { p.y = V_HEIGHT - margin - p.radius; }
                });

                if (conn && conn.open) {
                    conn.send({
                        type: 'sync', ball: { x: ball.x, y: ball.y },
                        pRed: { x: pRed.x, y: pRed.y, isKicking: pRed.isKicking },
                        pBlue: { x: pBlue.x, y: pBlue.y, isKicking: pBlue.isKicking },
                        scores: { red: redScore, blue: blueScore }
                    });
                }
                document.getElementById('red-score').innerText = redScore; document.getElementById('blue-score').innerText = blueScore;
            }

            // --- PROFESYONEL STADYUM ÇİZİMİ ---
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
            ctx.fillStyle = '#226633'; ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT); // Çim Rengi
            
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4;
            
            // Ana Saha Dış Çizgisi
            ctx.strokeRect(margin, margin, V_WIDTH - margin * 2, V_HEIGHT - margin * 2);
            
            // Orta Saha ve Santra Noktası
            ctx.beginPath(); ctx.moveTo(V_WIDTH / 2, margin); ctx.lineTo(V_WIDTH / 2, V_HEIGHT - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(V_WIDTH / 2, V_HEIGHT / 2, 110, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(V_WIDTH / 2, V_HEIGHT / 2, 5, 0, Math.PI * 2); ctx.fill();

            // KORNER YAYLARI (4 Köşe)
            let arcR = 25;
            // Sol Üst
            ctx.beginPath(); ctx.arc(margin, margin, arcR, 0, Math.PI / 2); ctx.stroke();
            // Sol Alt
            ctx.beginPath(); ctx.arc(margin, V_HEIGHT - margin, arcR, 3 * Math.PI / 2, 0); ctx.stroke();
            // Sağ Üst
            ctx.beginPath(); ctx.arc(V_WIDTH - margin, margin, arcR, Math.PI / 2, Math.PI); ctx.stroke();
            // Sağ Alt
            ctx.beginPath(); ctx.arc(V_WIDTH - margin, V_HEIGHT - margin, arcR, Math.PI, 3 * Math.PI / 2); ctx.stroke();

            // CEZA SAHALARI VE ALTIPAS (Büyük ve Küçük Kutular)
            let boxHeight = 340; let boxTop = (V_HEIGHT - boxHeight) / 2; let boxWidth = 140;
            let smallHeight = 160; let smallTop = (V_HEIGHT - smallHeight) / 2; let smallWidth = 50;
            let penDist = 110; // Penaltı noktasının çizgiye uzaklığı

            // Sol Ceza Sahası & Altıpas & Penaltı Noktası
            ctx.strokeRect(margin, boxTop, boxWidth, boxHeight);
            ctx.strokeRect(margin, smallTop, smallWidth, smallHeight);
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(margin + penDist, V_HEIGHT / 2, 4, 0, Math.PI * 2); ctx.fill();

            // Sağ Ceza Sahası & Altıpas & Penaltı Noktası
            ctx.strokeRect(V_WIDTH - margin - boxWidth, boxTop, boxWidth, boxHeight);
            ctx.strokeRect(V_WIDTH - margin - smallWidth, smallTop, smallWidth, smallHeight);
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(V_WIDTH - margin - penDist, V_HEIGHT / 2, 4, 0, Math.PI * 2); ctx.fill();

            // Kalelerin İç Ağ Bölgesi Çizimi
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(margin - goalDepth, goalTop, goalDepth, goalHeight); ctx.fillRect(V_WIDTH - margin, goalTop, goalDepth, goalHeight);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(margin, goalTop); ctx.lineTo(margin - goalDepth, goalTop); ctx.lineTo(margin - goalDepth, goalBottom); ctx.lineTo(margin, goalBottom); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(V_WIDTH - margin, goalTop); ctx.lineTo(V_WIDTH - margin + goalDepth, goalTop); ctx.lineTo(V_WIDTH - margin + goalDepth, goalBottom); ctx.lineTo(V_WIDTH - margin, goalBottom); ctx.stroke();

            // Top Çizimi
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            // Oyuncu Çizimleri
            [pRed, pBlue].forEach(p => {
                if (p.isKicking) { ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.number, p.x, p.y + 1);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(p.name, p.x, p.y + p.radius + 18);
            });

            requestAnimationFrame(update);
        }

        function triggerGoal(winner) {
            if (winner === 'red') redScore++; else blueScore++;
            if (conn && conn.open) conn.send({ type: 'goal_event', winner: winner });
            triggerGoalVisual(winner);
        }

        function triggerGoalVisual(winner) {
            isGameActive = false; playSound('goal');
            let flash = document.getElementById('goal-screen');
            flash.style.backgroundColor = (winner === 'red') ? 'rgba(255, 51, 102, 0.4)' : 'rgba(51, 153, 255, 0.4)';
            flash.classList.add('active');
            setTimeout(() => { flash.classList.remove('active'); resetPositions(); isGameActive = true; if(isHost) update(); }, 1200);
        }
    </script>
</body>
</html>
