<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaxball Gerçek Multiplayer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #141414; font-family: -apple-system, sans-serif; color: #fff; }
        
        #gameCanvas { width: 100%; height: 100%; display: block; background: #278042; touch-action: none; }

        .scoreboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            display: flex; align-items: center; background: rgba(0, 0, 0, 0.85); 
            padding: 6px 20px; border-radius: 30px; border: 2px solid #444; 
            font-weight: 900; font-size: 1.3rem; gap: 15px; pointer-events: none; z-index: 10; display: none;
        }
        .score.red { color: #ff3366; }
        .score.blue { color: #3399ff; }

        #mobile-kick-btn {
            display: none; position: absolute; bottom: 60px; right: 60px;
            width: 80px; height: 80px; background: #00ff66; border: 4px solid rgba(255,255,255,0.4);
            border-radius: 50%; color: #000; font-weight: 900; font-size: 1.1rem;
            align-items: center; justify-content: center; z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .chat-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 40%; max-width: 400px; display: flex; gap: 10px; z-index: 10; display: none;
        }
        #chat-input {
            flex: 1; background: rgba(0, 0, 0, 0.8); border: 2px solid #555;
            padding: 8px 15px; border-radius: 20px; color: #fff; font-size: 0.9rem; outline: none; user-select: text;
        }
        #chat-input:focus { border-color: #00ff66; }
        .send-btn { background: #00ff66; color: #000; border: none; padding: 0 15px; font-weight: bold; border-radius: 20px; cursor: pointer; }

        /* MENÜ / LOBİ */
        .screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%); z-index: 100; gap: 20px;
        }
        h1 { font-size: 3.5rem; color: #00ff66; font-weight: 900; letter-spacing: 3px; }
        
        .lobby-box {
            width: 90%; max-width: 450px; background: rgba(255,255,255,0.03); 
            border: 2px solid #333; border-radius: 20px; padding: 25px;
            display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.8rem; color: #888; font-weight: bold; letter-spacing: 1px; }

        input[type="text"] {
            background: #222; border: 2px solid #444; padding: 12px;
            border-radius: 10px; color: #fff; font-size: 1rem; outline: none; user-select: text;
        }
        input[type="text"]:focus { border-color: #00ff66; }

        .btn {
            background: #00ff66; color: #000; border: none; padding: 14px;
            font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer;
            text-align: center; width: 100%; margin-top: 5px;
        }
        .btn.sec { background: #3399ff; color: #fff; }
        
        .or-divider { text-align: center; color: #555; font-weight: bold; font-size: 0.9rem; margin: 5px 0; }

        #room-status { font-size: 0.95rem; color: #00ff66; text-align: center; font-weight: bold; min-height: 20px; }
        .code-display { background: #111; border: 1px dashed #00ff66; padding: 10px; border-radius: 8px; text-align: center; font-family: monospace; font-size: 1.2rem; color: #00ff66; cursor: pointer; }

        #leave-btn {
            position: absolute; top: 15px; right: 15px; background: rgba(255, 51, 102, 0.2);
            color: #ff3366; border: 2px solid #ff3366; padding: 6px 15px; border-radius: 20px;
            font-weight: bold; cursor: pointer; display: none; z-index: 15;
        }

        .goal-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 5rem; font-weight: 900; color: #fff; z-index: 90; opacity: 0;
            pointer-events: none; transition: opacity 0.15s ease;
        }
        .goal-flash.active { opacity: 1; }
        .hidden { display: none !important; }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div class="scoreboard" id="game-scoreboard">
        <span class="score red" id="red-score">0</span>
        <span style="color: #666;">-</span>
        <span class="score blue" id="blue-score">0</span>
    </div>

    <button id="leave-btn">ODADAN ÇIK</button>

    <div id="lobby-screen" class="screen">
        <h1>ZAXBALL P2P</h1>
        
        <div class="lobby-box">
            <div class="input-group">
                <label>OYUNCU ADI</label>
                <input type="text" id="name-input" placeholder="Adını yaz..." maxlength="12" value="OYUNCU">
            </div>

            <div id="initial-actions">
                <button class="btn" id="host-btn">SERVER / ODA KUR</button>
                <div class="or-divider">VEYA</div>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>ARKADAŞININ ODA KODU</label>
                    <input type="text" id="join-code-input" placeholder="Kodu buraya yapıştır...">
                </div>
                <button class="btn sec" id="join-btn">ODAYA KATIL</button>
            </div>

            <div id="status-area" class="hidden">
                <div id="room-status">Oda hazırlanıyor...</div>
                <div id="code-box" class="hidden">
                    <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px; text-align: center;">BU KODU ARKADAŞINA AT:</div>
                    <div class="code-display" id="generated-code">---</div>
                </div>
            </div>
        </div>
    </div>

    <div id="goal-screen" class="goal-flash">GOL!</div>
    <div id="mobile-kick-btn">ŞUT</div>

    <div class="chat-container" id="game-chat">
        <input type="text" id="chat-input" placeholder="Mesaj gönder..." maxlength="35">
        <button class="send-btn" id="send-btn">GÖNDER</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'kick') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(95, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.6, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'post') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } else if (type === 'goal') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
                    osc.linearRampToValueAtTime(180, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        // Ağ Bağlantı Değişkenleri
        let peer = null;
        let conn = null;
        let isHost = false; 
        let myId = "";

        let redScore = 0; let blueScore = 0; let isGameActive = false;

        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 8.5, friction: 0.976 };
        // Kırmızı Takım (Kurucu), Mavi Takım (Katılan)
        let pRed = { x: 0, y: 0, vx: 0, vy: 0, radius: 16.5, speed: 2.5, friction: 0.88, color: '#ff3366', name: 'EV SAHİBİ', number: '7', chatMessage: '', chatTimer: 0, isKicking: false };
        let pBlue = { x: 0, y: 0, vx: 0, vy: 0, radius: 16.5, speed: 2.5, friction: 0.88, color: '#3399ff', name: 'MİSAFİR', number: '1', chatMessage: '', chatTimer: 0, isKicking: false };

        let me = null; // Bu tarayıcıdaki oyuncuyu tutacak temsilci

        let keys = {};
        window.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (document.activeElement === chatInput) handleChatSubmit();
                else if (isGameActive) chatInput.focus();
                return;
            }
            if (e.key === ' ' || e.code === 'Space') { if (document.activeElement !== chatInput && isGameActive) { e.preventDefault(); me.isKicking = true; } return; }
            if (document.activeElement === chatInput || document.activeElement === document.getElementById('name-input') || document.activeElement === document.getElementById('join-code-input')) return;
            keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => { if (e.key === ' ' || e.code === 'Space') { me.isKicking = false; } keys[e.key.toLowerCase()] = false; });

        function checkAndExecuteKick(p) {
            let dx = ball.x - p.x; let dy = ball.y - p.y; let dist = Math.hypot(dx, dy);
            if (dist < p.radius + ball.radius + 10) {
                let nx = dx / dist; let ny = dy / dist;
                let kickPower = 13.0; // Füze gücü aktif
                ball.vx = nx * kickPower; ball.vy = ny * kickPower;
                playSound('kick');
            }
        }

        let joystick = { baseX: 100, baseY: 0, radius: 45, stickX: 100, stickY: 0, stickRadius: 20, active: false, touchId: null };
        document.addEventListener('touchmove', e => { if (isGameActive && e.target.id !== 'chat-input') e.preventDefault(); }, { passive: false });

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            joystick.baseY = canvas.height - 100; joystick.stickY = joystick.baseY;
            if(!isGameActive) resetPositions();
        }
        window.addEventListener('resize', resize); resize();

        // NETWORK: ODA KURMA (HOST)
        document.getElementById('host-btn').addEventListener('click', () => {
            initAudio();
            let pName = document.getElementById('name-input').value.trim() || "EV SAHİBİ";
            pRed.name = pName.toUpperCase();
            isHost = true;
            me = pRed; // Kurucu kırmızı takım

            document.getElementById('initial-actions').classList.add('hidden');
            document.getElementById('status-area').classList.remove('hidden');

            // Benzersiz 5 haneli kısa oda kodu üretelim
            let randomId = "ZAX-" + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(randomId);

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('room-status').innerText = "ODA KURULDU. ARKADAŞIN BEKLENİYOR...";
                document.getElementById('code-box').classList.remove('hidden');
                document.getElementById('generated-code').innerText = id;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupNetworkEvents();
            });
        });

        // NETWORK: ODAYA KATILMA (CLIENT)
        document.getElementById('join-btn').addEventListener('click', () => {
            initAudio();
            let code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if(!code) { alert("Lütfen geçerli bir oda kodu gir!"); return; }

            let pName = document.getElementById('name-input').value.trim() || "MİSAFİR";
            pBlue.name = pName.toUpperCase();
            isHost = false;
            me = pBlue; // Katılan mavi takım

            document.getElementById('room-status').innerText = "Bağlanılıyor...";
            document.getElementById('initial-actions').classList.add('hidden');
            document.getElementById('status-area').classList.remove('hidden');

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupNetworkEvents();
            });
        });

        function setupNetworkEvents() {
            conn.on('open', () => {
                // Bağlantı kurulunca ismi karşı tarafa gönder
                conn.send({ type: 'init', name: me.name });
            });

            conn.on('data', (data) => {
                if (data.type === 'init') {
                    if(isHost) {
                        pBlue.name = data.name;
                        conn.send({ type: 'init_reply', name: pRed.name });
                        startTheMatch();
                    }
                }
                if (data.type === 'init_reply') {
                    pRed.name = data.name;
                    startTheMatch();
                }
                
                // Host verileri işler, Client ise Host'tan gelen dünya simülasyonunu ekrana basar
                if (isHost) {
                    if (data.type === 'client_input') {
                        pBlue.vx = data.vx; pBlue.vy = data.vy;
                        pBlue.isKicking = data.isKicking;
                    }
                } else {
                    if (data.type === 'sync') {
                        ball.x = data.ball.x; ball.y = data.ball.y;
                        pRed.x = data.pRed.x; pRed.y = data.pRed.y;
                        pRed.isKicking = data.pRed.isKicking;
                        pBlue.x = data.pBlue.x; pBlue.y = data.pBlue.y;
                        redScore = data.scores.red; blueScore = data.scores.blue;
                        document.getElementById('red-score').innerText = redScore;
                        document.getElementById('blue-score').innerText = blueScore;
                    }
                    if (data.type === 'goal_event') {
                        triggerGoalVisual(data.winner);
                    }
                }

                // Chat Verisi alma
                if (data.type === 'chat') {
                    if(isHost) { pBlue.chatMessage = data.msg; pBlue.chatTimer = 180; }
                    else { pRed.chatMessage = data.msg; pRed.chatTimer = 180; }
                }
            });

            conn.on('close', () => {
                alert("Bağlantı koptu, arkadaşın odadan ayrıldı!");
                location.reload();
            });
        }

        function startTheMatch() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-scoreboard').style.display = 'flex';
            document.getElementById('game-chat').style.display = 'flex';
            document.getElementById('leave-btn').style.display = 'block';
            if ('ontouchstart' in window) document.getElementById('mobile-kick-btn').style.display = 'flex';

            isGameActive = true;
            resetPositions();
            update();
        }

        // Odadan Çıkış
        document.getElementById('leave-btn').addEventListener('click', () => { location.reload(); });

        // Mobil Kontroller
        window.addEventListener('touchstart', e => {
            if (!isGameActive) return;
            if (e.target.id === 'chat-input' || e.target.id === 'send-btn' || e.target.id === 'mobile-kick-btn' || e.target.id === 'leave-btn') return;
            for (let touch of e.changedTouches) {
                if (touch.clientX < canvas.width / 2) {
                    joystick.active = true; joystick.touchId = touch.identifier;
                    updateJoystick(touch.clientX, touch.clientY); break;
                }
            }
        });
        window.addEventListener('touchmove', e => {
            if (!joystick.active || !isGameActive) return;
            for (let touch of e.changedTouches) { if (touch.identifier === joystick.touchId) { updateJoystick(touch.clientX, touch.clientY); break; } }
        }, { passive: false });
        window.addEventListener('touchend', e => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joystick.touchId) {
                    joystick.active = false; joystick.touchId = null;
                    joystick.stickX = joystick.baseX; joystick.stickY = joystick.baseY; break;
                }
            }
        });

        const mobileKickBtn = document.getElementById('mobile-kick-btn');
        mobileKickBtn.addEventListener('touchstart', e => { e.preventDefault(); if (isGameActive) me.isKicking = true; });
        mobileKickBtn.addEventListener('touchend', e => { e.preventDefault(); me.isKicking = false; });

        function updateJoystick(touchX, touchY) {
            let dx = touchX - joystick.baseX; let dy = touchY - joystick.baseY; let dist = Math.hypot(dx, dy);
            if (dist <= joystick.radius) { joystick.stickX = touchX; joystick.stickY = touchY; } 
            else { joystick.stickX = joystick.baseX + (dx / dist) * joystick.radius; joystick.stickY = joystick.baseY + (dy / dist) * joystick.radius; }
            let jdx = joystick.stickX - joystick.baseX; let jdy = joystick.stickY - joystick.baseY;
            if (Math.hypot(jdx, jdy) > 5) {
                me.vx += ((jdx / joystick.radius) * me.speed - me.vx) * 0.15;
                me.vy += ((jdy / joystick.radius) * me.speed - me.vy) * 0.15;
            }
        }

        function handleLocalInput() {
            if (joystick.active || document.activeElement === chatInput) return;
            let targetVx = 0; let targetVy = 0; let moving = false;
            if (keys['w'] || keys['arrowup']) { targetVy = -me.speed; moving = true; }
            if (keys['s'] || keys['arrowdown']) { targetVy = me.speed; moving = true; }
            if (keys['a'] || keys['arrowleft']) { targetVx = -me.speed; moving = true; }
            if (keys['d'] || keys['arrowright']) { targetVx = me.speed; moving = true; }
            if (moving) {
                if (targetVx !== 0 && targetVy !== 0) { targetVx *= 0.7071; targetVy *= 0.7071; }
                me.vx += (targetVx - me.vx) * 0.18; me.vy += (targetVy - me.vy) * 0.18;
            } else { me.vx *= me.friction; me.vy *= me.friction; }
        }

        function handleChatSubmit() {
            let text = chatInput.value.trim(); if (!text) return;
            me.chatMessage = text; me.chatTimer = 180;
            if(conn && conn.open) conn.send({ type: 'chat', msg: text });
            chatInput.value = ''; chatInput.blur();
        }
        const chatInput = document.getElementById('chat-input');
        document.getElementById('send-btn').addEventListener('click', handleChatSubmit);

        function resetPositions() {
            let cx = canvas.width / 2; let cy = canvas.height / 2;
            ball.x = cx; ball.y = cy; ball.vx = 0; ball.vy = 0;
            pRed.x = cx - canvas.width * 0.22; pRed.y = cy; pRed.vx = 0; pRed.vy = 0; pRed.isKicking = false;
            pBlue.x = cx + canvas.width * 0.22; pBlue.y = cy; pBlue.vx = 0; pBlue.vy = 0; pBlue.isKicking = false;
        }

        function resolveCollision(obj1, obj2, isBall = false) {
            let dx = obj2.x - obj1.x; let dy = obj2.y - obj1.y; let distance = Math.hypot(dx, dy); let minDist = obj1.radius + obj2.radius;
            if (distance < minDist) {
                let overlap = minDist - distance; let nx = dx / distance; let ny = dy / distance;
                if (!isBall) { obj1.x -= nx * overlap * 0.5; obj1.y -= ny * overlap * 0.5; obj2.x += nx * overlap * 0.5; obj2.y += ny * overlap * 0.5; } 
                else { obj2.x += nx * overlap; obj2.y += ny * overlap; }
                let kx = obj1.vx - obj2.vx; let ky = obj1.vy - obj2.vy; let p = 2 * (nx * kx + ny * ky) / 2;
                obj1.vx -= nx * p; obj1.vy -= ny * p;
                obj2.vx += nx * p * (isBall ? 0.75 : 1); obj2.vy += ny * p * (isBall ? 0.75 : 1);
            }
        }

        function update() {
            if (!isGameActive) return;

            handleLocalInput();

            if (conn && conn.open) {
                if (!isHost) {
                    // Client iseniz sadece girdilerinizi Host'a gönderirsiniz
                    conn.send({ type: 'client_input', vx: me.vx, vy: me.vy, isKicking: me.isKicking });
                }
            }

            let margin = 45; let goalHeight = canvas.height * 0.35; let goalTop = (canvas.height - goalHeight) / 2;
            let goalBottom = goalTop + goalHeight; let goalDepth = 35;

            // FİZİK VE SİMÜLASYONU SADECE HOST ÇALIŞTIRIR (Senkronizasyon hatasını önlemek için)
            if (isHost) {
                pRed.x += pRed.vx; pRed.y += pRed.vy;
                pBlue.x += pBlue.vx; pBlue.y += pBlue.vy;

                if (pRed.isKicking) checkAndExecuteKick(pRed);
                if (pBlue.isKicking) checkAndExecuteKick(pBlue);

                let oldBallX = ball.x;
                ball.vx *= ball.friction; ball.vy *= ball.friction;
                ball.x += ball.vx; ball.y += ball.vy;

                if (ball.y < margin + ball.radius) { ball.y = margin + ball.radius; ball.vy *= -0.8; }
                if (ball.y > canvas.height - margin - ball.radius) { ball.y = canvas.height - margin - ball.radius; ball.vy *= -0.8; }

                // Gol Çizgisi Fiziği
                if (ball.y >= goalTop - 5 && ball.y <= goalBottom + 5) {
                    if (oldBallX >= margin - 2 && ball.x < margin + 5) { triggerGoal('blue'); }
                    else if (oldBallX <= canvas.width - margin + 2 && ball.x > canvas.width - margin - 5) { triggerGoal('red'); }
                }

                if (ball.x < margin + ball.radius && !(ball.y >= goalTop && ball.y <= goalBottom)) { ball.x = margin + ball.radius; ball.vx *= -0.8; }
                if (ball.x > canvas.width - margin - ball.radius && !(ball.y >= goalTop && ball.y <= goalBottom)) { ball.x = canvas.width - margin - ball.radius; ball.vx *= -0.8; }

                if (Math.abs(ball.x - margin) < ball.radius && (Math.abs(ball.y - goalTop) < ball.radius || Math.abs(ball.y - goalBottom) < ball.radius)) { ball.vx *= -0.9; ball.vy *= -0.9; playSound('post'); }
                if (Math.abs(ball.x - (canvas.width - margin)) < ball.radius && (Math.abs(ball.y - goalTop) < ball.radius || Math.abs(ball.y - goalBottom) < ball.radius)) { ball.vx *= -0.9; ball.vy *= -0.9; playSound('post'); }

                resolveCollision(pRed, pBlue); resolveCollision(pRed, ball, true); resolveCollision(pBlue, ball, true);

                [pRed, pBlue].forEach(p => {
                    if (p.x < margin + p.radius) { p.x = margin + p.radius; p.vx *= -0.3; } if (p.x > canvas.width - margin - p.radius) { p.x = canvas.width - margin - p.radius; p.vx *= -0.3; }
                    if (p.y < margin + p.radius) { p.y = margin + p.radius; p.vy *= -0.3; } if (p.y > canvas.height - margin - p.radius) { p.y = canvas.height - margin - p.radius; p.vy *= -0.3; }
                });

                // Client'a dünyayı yolla
                if (conn && conn.open) {
                    conn.send({
                        type: 'sync',
                        ball: { x: ball.x, y: ball.y },
                        pRed: { x: pRed.x, y: pRed.y, isKicking: pRed.isKicking },
                        pBlue: { x: pBlue.x, y: pBlue.y, isKicking: pBlue.isKicking },
                        scores: { red: redScore, blue: blueScore }
                    });
                }
                document.getElementById('red-score').innerText = redScore;
                document.getElementById('blue-score').innerText = blueScore;
            } else {
                // Client kendi yerel sönümlenmesini yapar, ekranı pürüzsüzleştirir
                me.x += me.vx; me.y += me.vy;
            }

            // --- SAHA ÇİZİMLERİ ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#278042'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 4;
            ctx.strokeRect(margin, margin, canvas.width - margin * 2, canvas.height - margin * 2);
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, margin); ctx.lineTo(canvas.width / 2, canvas.height - margin); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, canvas.height * 0.22, 0, Math.PI * 2); ctx.stroke();
            
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(margin - goalDepth, goalTop, goalDepth, goalHeight); ctx.fillRect(canvas.width - margin, goalTop, goalDepth, goalHeight);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(margin, goalTop); ctx.lineTo(margin - goalDepth, goalTop); ctx.lineTo(margin - goalDepth, goalBottom); ctx.lineTo(margin, goalBottom); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(canvas.width - margin, goalTop); ctx.lineTo(canvas.width - margin + goalDepth, goalTop); ctx.lineTo(canvas.width - margin + goalDepth, goalBottom); ctx.lineTo(canvas.width - margin, goalBottom); ctx.stroke();

            if ('ontouchstart' in window || joystick.active) {
                ctx.save(); ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 4; ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.fillStyle = 'rgba(0, 255, 102, 0.5)'; ctx.arc(joystick.stickX, joystick.stickY, joystick.stickRadius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            }

            // Top
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            // İki Oyuncu
            [pRed, pBlue].forEach(p => {
                if (p.isKicking) { ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 1.5, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.number, p.x, p.y + 1);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(p.name, p.x, p.y + p.radius + 14);

                if (p.chatTimer > 0) {
                    p.chatTimer--; ctx.save(); ctx.font = '12px sans-serif';
                    let textWidth = ctx.measureText(p.chatMessage).width; let bubbleW = textWidth + 16;
                    let bubbleX = p.x - bubbleW / 2; let bubbleY = p.y - p.radius - 32;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.roundRect(bubbleX, bubbleY, bubbleW, 24, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#fff'; ctx.fillText(p.chatMessage, p.x, bubbleY + 13); ctx.restore();
                }
            });

            requestAnimationFrame(update);
        }

        function triggerGoal(winner) {
            if (winner === 'red') redScore++; else blueScore++;
            if (conn && conn.open) conn.send({ type: 'goal_event', winner: winner });
            triggerGoalVisual(winner);
        }

        function triggerGoalVisual(winner) {
            isGameActive = false; playSound('goal');
            let flash = document.getElementById('goal-screen');
            flash.style.backgroundColor = (winner === 'red') ? 'rgba(255, 51, 102, 0.4)' : 'rgba(51, 153, 255, 0.4)';
            flash.classList.add('active');
            setTimeout(() => { flash.classList.remove('active'); resetPositions(); isGameActive = true; if(isHost) update(); }, 1200);
        }
    </script>
</body>
</html>
